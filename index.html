<html>
<head>
    <title>Risky flying game</title>
    <link rel="stylesheet" href="frontend/style.css">
</head>

<body>
    <canvas id = "gameCanvas"></canvas>


    <div id='leaderboardContainer'>
        <div id = "leaderboardTitle">Leaderboard:</div>
        <table id = "leaderboard">
            <thead>
                <tr>
                    <th>Position:</th>
                    <th>Username:</th>
                    <th>Time:</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>pos1</td>
                    <td>user1</td>
                    <td>time1</td>
                </tr>
            </tbody>
        </table>
    </div>



    <form id = "userForm">
        <label for="playerUsername" id = "userFormLabel">Enter your username:</label>
        <input type="text" id="userFormInput" name="username" >
        <label for="playerUsername" >(Max length 14 characters)</label>
        <button type = "button" id = "userFormButton">Go</button>
    </form> 



    <footer>
        <div id = 'footerTitle'>Attributions:</div>
        <a href="https://www.flaticon.com/free-icons/cloud" title="cloud icons">Cloud icons created by Freepik - Flaticon</a>
        <a href="https://www.flaticon.com/free-icons/heart" title="heart icons">Heart icons created by frelayasia - Flaticon</a>
    </footer>


    <script type = "module" src="frontend/game.js" ></script>
</body>
</html>
