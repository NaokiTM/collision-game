pages:
  stage: deploy
  script:
    - mkdir .public               # Create deployment directory
    - cp -r frontend/* .public/   # Copy all frontend files for deployment
  artifacts:
    paths:
      - .public                   # Files to be served by GitLab Pages
  rules:
    - changes:                    # Trigger deployment only if:
        - frontend/**             # Frontend files change
        - .gitlab-ci.yml          # CI/CD config changes
    - when: always
